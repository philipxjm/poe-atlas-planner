<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PoE Atlas Planner — optimal pathing</title>
<meta name="description" content="Path of Exile 3.29 atlas passive tree planner: pick the nodes you want, block the ones you don't, get the minimum-point tree computed for you.">
<!-- Inline so it costs no request, and in the app's own palette: gold pick, teal path. -->
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%2312161c'/%3E%3Cg stroke='%233fd0c9' stroke-width='2.4' stroke-linecap='round'%3E%3Cpath d='M16 16 16 7'/%3E%3Cpath d='M16 16 8 23'/%3E%3Cpath d='M16 16 24 23'/%3E%3C/g%3E%3Cg fill='%23c9a35c'%3E%3Ccircle cx='16' cy='7' r='3'/%3E%3Ccircle cx='8' cy='23' r='3'/%3E%3Ccircle cx='24' cy='23' r='3'/%3E%3C/g%3E%3Ccircle cx='16' cy='16' r='4.6' fill='%23ffd76b'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header id="bar">
  <h1>Atlas <span>Planner</span> <small>3.29</small></h1>
  <div id="points">0 / 138 pts</div>
  <div id="status">loading tree…</div>
  <div class="spacer"></div>
  <div id="search-wrap">
    <input id="search" type="search" placeholder="Search nodes &amp; bonuses" autocomplete="off" spellcheck="false" aria-label="Search nodes and bonuses">
    <span id="search-n"></span>
  </div>
  <button id="solve" class="primary">Find Path</button>
  <button id="mechanics">Mechanics</button>
  <button id="bonuses">Bonuses (0)</button>
  <button id="fit">Fit</button>
  <button id="clear-picks">Clear picks</button>
  <button id="clear-blocks">Clear blocks</button>
  <button id="share">Share link</button>
</header>
<canvas id="tree"></canvas>
<aside id="key" class="hidden"></aside>
<aside id="panel" class="hidden">
  <h2>Atlas bonuses</h2>
  <div id="panel-body"></div>
</aside>
<div id="tooltip"></div>
<div id="toast"></div>
<footer id="legend">
  <span><i class="sw picked"></i>picked</span>
  <span><i class="sw path"></i>path</span>
  <span><i class="sw blocked"></i>blocked</span>
  <span><i class="sw wormhole"></i>gateway</span>
  <span><i class="sw travel"></i>travel</span>
  <span><i class="sw search"></i>search hit</span>
  <span>node colour = mechanic <b>(Mechanics for the key)</b></span>
  <span class="dim">left-click pick · right-click block · click wheel-center: highlight clusters · <b>/</b> search, <b>Enter</b> to walk matches</span>
  <span><a href="https://github.com/philipxjm/poe-atlas-planner" rel="noopener">source</a> · <a href="/">more tools</a></span>
</footer>
<script type="module" src="js/main.js"></script>
<script data-goatcounter="https://philipxjm.goatcounter.com/count" async src="https://gc.zgo.at/count.js"></script>
</body>
</html>
